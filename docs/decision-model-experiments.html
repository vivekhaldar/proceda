 first:{llm:[2537,1932],jev:[0,906],cost:[6.43286655,5.149479648],latency:[8.1518263,7.1274761],correct:[357,356],domains:[['Referral',1280,800,160,160,160],['Email',558,558,145,144,148],['Patient',699,574,52,52,52]]},

const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const fmt=n=>n.toLocaleString('en-US');
const svg=(content,label,w=1152,h=350)=>`<svg class="diagram" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><defs><marker id="arrow-${svg.id++}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="${C.muted}"/></marker></defs>${content}</svg>`;svg.id=0;

const rect=(x,y,w,h,fill=C.soft,stroke='none',rx=5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}"/>`;
const line=(x1,y1,x2,y2,color=C.line,width=1,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
const arrow=(points,color=C.muted)=>{let p=points.split(' ').map(a=>a.split(',').map(Number));let [x,y]=p.at(-1),[a,b]=p.at(-2),dx=x-a,dy=y-b,L=Math.hypot(dx,dy),u=dx/L,v=dy/L;return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>`+`<path d="M${x},${y} L${x-u*9-v*4},${y-v*9+u*4} L${x-u*9+v*4},${y-v*9-u*4} Z" fill="${color}"/>`;};

function completionFlow(){let s=node(10,125,200,90,['Qwen selects','application tools'],'llm')+node(265,125,210,90,['Tools run','Receipts recorded'])+node(530,125,220,90,['Jev checks','step completion'],'native')+node(835,20,280,80,['Advance to next step'])+node(835,245,280,80,['Qwen continues','the current step'],'llm');s+=arrow('210,170 265,170')+arrow('475,170 530,170')+arrow('750,150 790,150 790,60 835,60',C.green)+arrow('750,190 790,190 790,285 835,285');s+=tx(808,112,'Both yes ≥ 0.8',17,C.green)+tx(808,226,'No or uncertain',17,C.muted);s+=tx(14,360,'Only successful, eligible non-final tool batches can use this check.',21,C.muted);return svg(s,'Qwen selects tools. Tools run and record receipts. Jev checks completion. Both yes probabilities at least0.8 advances. Otherwise Qwen continues.',1152,385);}

function waterfall(){let vals=[2537,480,129,141,2,1785],labs=[['Qwen-only'],['Referral','completion'],['Patient','completion'],['Email','business'],['Other email','differences'],['Full hybrid']],s='',top=35,bottom=322,sc=(bottom-top)/2700,x0=45,step=180,bw=114,total=2537;for(let i=0;i<6;i++){let x=x0+i*step,low=0,high=vals[i],fill=i===5?C.green:C.ink;if(i>0&&i<5){high=total;total-=vals[i];low=total;fill=i===3?C.blue:i===4?C.amber:C.mint;}let y=bottom-high*sc,h=(high-low)*sc;s+=rect(x,y,bw,h,fill,'none',0)+tx(x+bw/2,y-14,(i>0&&i<5?'−':'')+fmt(vals[i]),27,i===4?C.amber:C.ink,'middle',500)+multiline(x+bw/2,bottom+36,labs[i],19,C.muted);if(i<5)s+=line(x+bw,bottom-(i===0?2537:total)*sc,x+step,bottom-(i===0?2537:total)*sc,C.muted,1,'4 4');}s+=line(25,bottom,1130,bottom,C.line);return svg(s,'Cumulative waterfall in the four-arm rerun:2537 minus480 referral completion,129 patient completion,141 email business and2 other email differences equals1785 Qwen calls.',1152,405);}
function columns(values,max,format,color=C.green,label){let s='';let bx=45,by=302,bw=75,step=132,sc=225/max;for(let t=0;t<=max;t+=max/2){let y=by-t*sc;s+=line(20,y,525,y,C.line)+tx(12,y+6,format(t),15,C.muted,'end');}values.forEach((v,i)=>{let x=bx+i*step,y=by-v*sc;s+=rect(x,y,bw,v*sc,i===3?color:C.line,'none',2)+tx(x+bw/2,y-13,format(v),23,i===3?color:C.ink,'middle',500)+tx(x+bw/2,by+34,'ABCD'[i],21,C.muted,'middle');});return svg(s,label,560,360);}
function hosted(){let s='';[[2537,0,'A'],[1785,1052,'D']].forEach(([llm,jev,arm],i)=>{let y=40+i*120,x=88,k=.337;s+=tx(0,y+35,arm,29,C.muted,'start',600)+rect(x,y,llm*k,62,C.ink,'none',2)+tx(x+llm*k/2,y+39,`${fmt(llm)} Qwen`,23,C.paper,'middle');if(jev)s+=rect(x+llm*k,y,jev*k,62,C.green,'none',2)+tx(x+(llm+jev/2)*k,y+39,`${fmt(jev)} Jev`,23,C.paper,'middle');s+=tx(x+(llm+jev)*k+20,y+40,fmt(llm+jev),25,C.ink,'start',500);});return svg(s,'Hosted inference requests rise from2537 to2837. The full hybrid has1785 Qwen and1052 Jev requests.',1152,255);}

slide('Decision models inside Proceda','Two experiments',`<h1>Decision models<br>inside Proceda</h1><div class="cover-bottom"><p class="cover-sub">Completion checks, business decisions,<br>and the impact of using both.</p><div class="cover-mini">Vivek Haldar<br>October 5, 2026<br>Qwen 3.8 27B + hosted Jev</div></div>`,{dark:true,cover:true,foot:'Evidence from three SOP-Bench domains',notes:'This deck explains the completion-only Qwen/Jev experiment and the subsequent bounded business-decision experiment. It does not cover the earlier GLM/Winnow comparison or the interrupted local Laya run. Models and the 0.8 threshold stay the same across the two experiments.'});
slide('Two jobs for a decision model','The change to Proceda',`<div class="split"><div><div class="chapter">01</div><h3>Completion checking</h3><p class="question">Has this step<br>finished?</p><p class="detail">Jev inspects executed tool evidence.<br>It can remove a Qwen continuation.</p></div><div><div class="chapter blue">02</div><h3>Business decisions</h3><p class="question">What is the<br>business outcome?</p><p class="detail">Jev selects a bounded result.<br>Uncertainty returns control to Qwen.</p></div></div>`,{source:'second',notes:'The original executor uses Qwen to propose work, interpret results and complete steps. Experiment1 adds fast completion after successful eligible tool batches. Experiment2 adds source compilation and reviewed decision contracts; a valid native result can directly settle a business step. Tool execution and final rendering retain the existing executor.'});
slide('The comparison stays controlled','Benchmark design',`<div class="strip"><div style="width:44.444%;background:${C.green};color:${C.paper}"><b>160</b> Referral</div><div style="width:41.111%;background:${C.mint}"><b>148</b> Email</div><div style="width:14.445%;background:${C.line}"><b>52</b> Patient</div></div><p class="caption">360 reused validation cases in every arm</p><ul class="thin-list" style="margin-top:30px"><li><span class="term">Main LLM</span><span>Qwen 3.8 27B on Nebius Token Factory<br><span class="caption">Temperature 0, low reasoning, 2,048 output tokens</span></span></li><li><span class="term">Decision model</span><span>Hosted Jev 1.13.0, threshold 0.8</span></li><li><span class="term">Execution</span><span>720 runs in experiment 1. 1,440 runs in experiment 2.<br><span class="caption">Parallel domains, balanced arm order, unchanged SOPs and strict scoring</span></span></li></ul>`,{source:'second',foot:'Pilots excluded. Simulated tools and automated clarification responses.',notes:'Experiment1 has two arms for each of360 cases. Experiment2 has four. The domains run in parallel with up to four case groups per domain. Cases use a rotated arm order. These are reused validation cases, not an untouched confirmation set. The 0.8 business threshold applies to selected-option probability; completion checking requires both yes probabilities to reach0.8. Costs use fixed protocol list rates, not verified invoices.'});
slide('After the tool returns','Experiment 1 / mechanism',completionFlow(),{source:'first',notes:'The original Qwen loop often makes another LLM call to acknowledge that a successful tool batch has completed the step. Jev receives the original step and actual tool receipts, including recorded clarification evidence when present. If both completion answers reach0.8, the executor takes its normal complete_step transition without another LLM call. Otherwise it continues with Qwen. Proposal verification and SOP compilation are disabled. Application tools still execute, and the final step stays generative.'});
slide('605 LLM calls removed','Experiment 1 / results',pairBars()+`<div class="legend"><span><i style="background:${C.line}"></i>Qwen-only</span><span><i style="background:${C.green}"></i>Qwen + Jev completion</span></div><div class="metrics"><div><div class="stat green">23.8%</div><p class="label">fewer LLM calls</p></div><div><div class="stat green">20.0%</div><p class="label">lower estimated API cost</p></div><div><div class="stat green">12.6%</div><p class="label">lower mean case latency</p></div><div><div class="stat">357 / 356</div><p class="label">correct out of 360</p></div></div>`,{source:'first',foot:'The additional email failure remains in the result.',notes:'Original completion-only comparison:2537 to1932 Qwen calls. Cost6.43286655 to5.149479648 USD, including906 Jev checks. Mean latency8.1518263 to7.1274761 seconds. Correctness357/360 to356/360. Email E1076 adds the hybrid failure: Jev rejected completion and Qwen then selected a different action. The trace does not show an accepted gate skipping that comparison. No blanket accuracy-equivalence claim is supported.'});
slide('Three acknowledgments per referral case','Experiment 1 / where calls disappeared',callSequence()+`<div class="metrics"><div><div class="stat">8 <span style="font-size:30px;color:${C.muted}">to</span> 5</div><p class="label">Qwen calls per referral case</p></div><div><div class="stat green">480</div><p class="label">referral continuations removed</p></div><div><div class="stat green">125</div><p class="label">patient continuations removed</p></div><div><div class="stat">0</div><p class="label">email continuations removed</p></div></div>`,{source:'first',foot:'Email catalog retrieval still leaves comparison and response work unfinished.',notes:'Referral removes one acknowledgment after each of account investigation, traffic analysis and guideline retrieval, over160 cases. Policy scoring and enforcement selection remain Qwen calls. Patient savings are37 lifestyle-risk,52 overall-risk and36 registration continuations. Insurance, prescription-benefit and pharmacy steps retain documentation obligations, so none of those checks is accepted. Email rejects all114 completion checks. Every patient case still executes all six tools.'});
slide('A bounded decision can finish the step','Experiment 2 / mechanism',businessFlow(),{source:'second',notes:'The business_decisions mode compiles original SOP text, tool schemas and input field names before task execution. It independently reviews admitted pure decision contracts. The runtime binds immutable inputs, accepted earlier facts, or unique successful tool receipts. Jev receives the entire original step policy. A valid selected outcome at probability≥0.8 produces a typed fact and completes the step. Uncertainty falls back to constrained Qwen record_decision with identical policy and evidence. Invalid constrained output falls back to the ordinary step loop. Tool and render operations are not optimized by this business mode. Boolean predicates are implemented as well as finite choices, but these benchmark runs admit only email intent.'});
slide('Four arms isolate the contribution','Experiment 2 / controls',`<table class="comparison"><thead><tr><th>Arm</th><th>Completion checks</th><th>Business interface</th><th>Business model</th><th>LLM calls</th></tr></thead><tbody><tr><td><span class="arm">A</span>Qwen-only</td><td>Off</td><td>Off</td><td>Ordinary Qwen</td><td>2,537</td></tr><tr><td><span class="arm">B</span>Completion</td><td>Jev</td><td>Off</td><td>Ordinary Qwen</td><td>1,929</td></tr><tr><td><span class="arm">C</span>Business-Qwen</td><td>Jev</td><td>Same frozen plan</td><td>Constrained Qwen</td><td>1,930</td></tr><tr class="accent"><td><span class="arm">D</span>Business-Jev</td><td>Jev</td><td>Same frozen plan</td><td>Jev + Qwen fallback</td><td>1,785</td></tr></tbody></table><p class="big-copy" style="margin-top:32px"><strong>C versus D</strong> isolates native business inference.<br>B versus C also changes the interface and prompts.</p>`,{source:'second',notes:'Use the four-arm rerun for the cumulative comparison. B-A measures adding completion checks. C-B measures structured execution with a constrained Qwen decision and source preparation. D-C compares native Jev against the same business interface. Counts are actual total Qwen requests and are not monotonic: C uses one more than B because two additional patient continuations offset one fewer email call. D-C has145 fewer total Qwen calls, consisting of141 direct email substitutions and four patient completion-control differences.'});
slide('Jev handled 141 of 148 email intents','Experiment 2 / native coverage',`<div class="split wide"><div>${waffle()}<div class="legend"><span><i style="background:${C.green}"></i>141 Jev decisions</span><span><i style="background:${C.amber}"></i>7 Qwen fallbacks</span></div></div><div><div class="stat large green">95.3%</div><p class="label">of intents settled by Jev</p><div class="rule" style="margin-top:28px"><p class="big-copy">141 / 141 accepted<br>intents match the reference.</p><p class="annotation">All seven fallback cases also pass.<br>Both business arms finish <strong>148 / 148</strong>.</p></div></div></div>`,{source:'second',notes:'141 native_choice facts have matching settled planning actions. Seven uncertain native responses fall back to constrained Qwen. All148 final cases match the strict reference in C and D. Accepted coverage by reference class:31/32 listing concerns,37/37 pricing concerns,43/43 description concerns,30/36 generic questions. The fifth permitted outcome, unable to decide, has no reference cases, so the dataset does not validate its correct use.'});
slide('141 fewer calls, with the same outcomes','Experiment 2 / isolated email impact',emailBars()+`<div class="metrics"><div><div class="stat green">25.4%</div><p class="label">fewer total Qwen calls</p></div><div><div class="stat green">11.3%</div><p class="label">lower whole-email API cost</p></div><div><div class="stat green">18.2%</div><p class="label">lower mean case latency</p></div></div><p class="annotation">Decision-stage cost: <strong>$0.1316 to $0.0103</strong>, including all Jev attempts and fallbacks.</p>`,{source:'second',foot:'C versus D. Execution estimates exclude source preparation.',notes:'C has408 ordinary Qwen calls and148 constrained decisions. D has the same408 ordinary calls and seven constrained fallbacks. Both make112 Jev completion checks and all are rejected. Every paired catalog call and result matches, which isolates the141-call reduction as business-decision substitution. Cost1.036625616 to.919393842 USD, mean case latency4.9912529516 to4.0834512083 seconds. Business-stage cost.13158375 to.010281696 USD, a92.2% reduction. Downstream token counts vary, so whole-email cost falls by less than the decision-stage saving. Total hosted requests grow668 to675 because abstentions add a Jev call before Qwen.'});
slide('Abstention corrected two wrong top choices','Experiment 2 / why fallback matters',confidenceBars()+`<p class="big-copy">Both uncertain choices reached Qwen.<br>Both final intents match the reference.</p>`,{source:'second',foot:'Selected-option probability controls routing. Scores are not calibrated error probabilities.',notes:'Jev’s unconditional top labels match146/148 references. The two wrong top labels are E1102, bundle pricing classified as incorrect pricing at.51, and E1126, gift options classified as unable to decide at.59. Both are below.8 and Qwen correctly selects generic. Other fallbacks: E1012 .76, E1138 .61, E1194 .69, E1246 .78 and E1254 .49. All seven pass. This is evidence that abstention helped on observed cases, not proof that.8 is optimal or calibrated. The separate provider confidence field does not set the threshold: E1146 was accepted at selected-option probability.80 despite provider confidence.75.'});
slide('Direct decision coverage was selective','Experiment 2 / boundaries',`<table class="comparison"><thead><tr><th>Domain</th><th>Direct business path</th><th>What kept the work with Qwen?</th></tr></thead><tbody><tr><td>Email intent</td><td class="green"><b>Admitted</b><small>141 accepted, 7 fallbacks</small></td><td>Catalog comparison and action selection still use Qwen</td></tr><tr><td>Referral policy</td><td class="amber">Not admitted</td><td>The compiler emitted an invalid decision contract</td></tr><tr><td>Patient eligibility</td><td>Not admitted</td><td>No fully represented, separable eligibility decision</td></tr></tbody></table><p class="big-copy" style="margin-top:34px">Source compilation now limits <strong>business-decision coverage</strong>.</p><p class="annotation">The run establishes email intent performance. Policy predicates and eligibility still need direct empirical tests.</p>`,{source:'second',notes:'Referral’s compiler emits its nested decision object as a JSON string. Strict validation rejects it, preserving ordinary Qwen execution. This tests compiler reliability, not Jev’s ability to apply referral scoring. Patient risk calculations are delegated to required tools, and eligibility shares a step with registration while lacking a fully specified standalone threshold. The interpreter does not invent one or omit the tools. Predicate support is implemented and unit-tested, but no native predicate runs in these benchmarks. All model settings and the2048-token budget remain fixed.'});
slide('The complete cascade','Both changes in Proceda',combinedFlow(),{source:'design',foot:'Completion checks apply only after successful eligible non-final tool batches.',notes:'Business mode selects the top path only for an admitted, fully represented pure decision with valid evidence. A native accepted outcome records a fact. A valid constrained fallback records the same fact. Invalid or missing contracts and invalid fallback results return to ordinary Qwen execution. Ordinary tool work retains its original executor. After successful eligible non-final application batches, the existing completion checker can advance or return control to Qwen. Final rendering remains Qwen work. Backend providers and thresholds are deployment configuration; SOP authors do not write this cascade.'});
slide('Cumulative calls: 2,537 to 1,785','Four-arm rerun / full stack',waterfall()+`<div class="legend"><span><i style="background:${C.mint}"></i>609 completion bypasses</span><span><i style="background:${C.blue}"></i>141 direct business decisions</span><span><i style="background:${C.amber}"></i>2 other email differences</span></div><p class="annotation"><strong>752 fewer Qwen calls, a 29.6% reduction.</strong> All figures come from the same rerun.</p>`,{source:'second',notes:'The full hybrid D removes480 referral continuations and129 patient continuations relative to Qwen-only A. Direct email business choices remove141 constrained Qwen calls compared with C. Two additional email-call differences accompany the changed structured interface and branch execution. Together these explain752 fewer Qwen requests,2537 to1785. Do not sum the first experiment’s605 bypasses with141 business decisions: separate executions have different completion outcomes. Also distinguish D-C145 from141: four of those calls are patient control variation with zero direct business decisions.'});
slide('The stack lowers cost and mean latency','Four-arm rerun / performance',`<div class="split" style="gap:36px"><div><h3>Estimated execution cost</h3>${columns(DATA.stack.cost,8,n=>'$'+n.toFixed(n===0?0:2),C.green,'Cost in USD across360 cases per arm: A6.4099884 B5.142587748 C4.827737028 D4.703253132')}<div class="stat green" style="font-size:43px">26.6% lower</div></div><div><h3>Mean case latency</h3>${columns(DATA.stack.latency,10,n=>n.toFixed(n===0?0:2)+'s',C.blue,'Mean case latency in seconds: A8.6425 B7.7583 C7.2645 D6.9382')}<div class="stat blue" style="font-size:43px">19.7% lower</div></div></div>`,{source:'second',foot:'A Qwen-only, B completion, C business-Qwen, D business-Jev. Preparation excluded.',notes:'Cost includes Qwen and hosted Jev, using unchanged list rates: Qwen .45USD/M input and3USD/M output, Jev .042USD/M input and free output. Cached input is priced at the full ordinary input rate; billing is not independently verified. The full D cost comprises4.64061555USD Qwen and.062637582USD Jev. Mean case latency includes source-cache loading, tool setup/cleanup, automatic clarification and shared-provider contention. p95 falls16.064s to15.274s, a smaller change than the mean. These are observations under concurrent benchmark load, not production guarantees.'});
slide('Accuracy across the four arms','Four-arm rerun / interpretation',`<table class="comparison small-table"><thead><tr><th>Correct tasks</th><th>A<br>Qwen-only</th><th>B<br>Completion</th><th>C<br>Business-Qwen</th><th>D<br>Business-Jev</th></tr></thead><tbody><tr><td>Referral</td><td>160 / 160</td><td class="amber">159 / 160</td><td>160 / 160</td><td>160 / 160</td></tr><tr><td>Email</td><td>145 / 148</td><td>146 / 148</td><td class="green">148 / 148</td><td class="green">148 / 148</td></tr><tr><td>Patient</td><td>52 / 52</td><td>52 / 52</td><td>52 / 52</td><td>52 / 52</td></tr><tr class="accent"><td>Total</td><td>357 / 360</td><td>357 / 360</td><td>360 / 360</td><td>360 / 360</td></tr></tbody></table><p class="big-copy" style="margin-top:26px">Constrained Qwen already scores <strong>360 / 360</strong>.<br>Jev preserves the observed result while reducing calls.</p>`,{source:'second',foot:'Strict final-field correctness does not certify every business obligation.',notes:'The native C-D comparison has no accuracy regressions or improvements. C already achieves360/360, so D’s improvement over A cannot be credited to Jev business inference. Changed interface and context, plus ordinary generation variation, remain relevant. B’s referral failure ACC100149 correctly chooses Account Closure but escapes the required XML tags, causing empty strict extraction. The failure remains scored. Email E1256 lacks corrected product specifications: baseline clarification is defensible even though the reference expects update description. Matching that reference does not prove complete semantic correctness. Simulated patient clarifications and required tool receipts were audited, but this is not clinical validation.'});
slide('More hosted requests can still cost less','Full stack / accounting',hosted()+`<div class="split rule" style="margin-top:10px"><div><div class="stat green" style="font-size:58px">$4.831</div><p class="label">Full hybrid including final preparation</p></div><div><p class="big-copy"><strong>24.6% below</strong> the $6.410 baseline</p><p class="annotation">Includes the full $0.128 source-preparation cost.<br>Historical development attempts cost another $0.208.</p></div></div>`,{source:'second',notes:'D has1785 Qwen requests and1052 Jev requests,2837 total, versus2537 hosted requests for A. Jev requests are much cheaper under the protocol rates. Final preparation costs.12769755USD and is charged in full to either independently deployed C or D. D including final preparation costs4.830950682USD for360 cases,24.634% below A. Earlier v1-v3 attempts total.20791485USD and all four versions total.33561240USD. The physical experiment across four arms plus pilot plus all preparation costs22.333484412USD, distinct from one deployed pipeline’s per-batch cost. No source preparation is charged again for copied caches.'});
slide('Decision models helped selectively','What the evidence supports',`<div class="split wide"><div><p class="big-copy" style="font-size:42px;line-height:1.25">Proceda can delegate<br><strong>finished-step checks</strong><br>and <strong>bounded judgments</strong><br>behind the same SOP.</p></div><div><ul class="thin-list"><li style="grid-template-columns:1fr"><span>Completion checking removed redundant continuations in referral and intake.</span></li><li style="grid-template-columns:1fr"><span>Direct intent decisions added measurable savings for email.</span></li><li style="grid-template-columns:1fr"><span>Reliable source contracts and broader policy coverage remain the next test.</span></li></ul></div></div><p class="annotation" style="margin-top:28px">Observed accuracy stayed intact in the isolated business-model comparison.<br>Reused cases, simulated tools and uncalibrated probabilities limit generalization.</p>`,{dark:true,source:'second',notes:'Supported conclusion: native decision models can remove both acknowledgment work and some bounded business inference. The completion-only run had one additional final-task error, which must remain visible. The direct business comparison preserves148/148 email correctness and saves141 Qwen calls. The combined system improves these benchmark final-field results, but the structured Qwen control already attains the same accuracy. Source compilation blocks referral’s direct business route; patient eligibility remains unsupported. Broader policy evaluation and unseen confirmation are future work, not results of this deck.'});
slide('Reports, data and reproduction','Evidence',`<div class="source-list"><div><h3>Experiment 1</h3>${external(SRC.first,'Qwen + Jev completion checks')}<p>720 full executions<br>605 verified continuation bypasses<br>Raw traces, receipt audits and accuracy failures</p><h3 style="margin-top:30px">Implementation</h3>${external(SRC.design,'Bounded business-decision design')}<p>Source contracts, typed facts, fallback and evidence binding</p></div><div><h3>Experiment 2</h3>${external(SRC.second,'Bounded business decisions')}<p>1,440 full executions across four arms<br>Full attribution, preparation and cost accounting<br>Verified archive of 27,937 files</p><h3 style="margin-top:30px">Chart provenance</h3>${external(SRC.data,'Audited metrics and source hashes')}<p>Full-precision values and explicit comparison boundaries</p></div></div><p class="caption rule" style="margin-top:35px">Implementation tested before inference: 889 tests passed. Both benchmark reports preserve every provider attempt, final-field failure and uncertain decision. This HTML deck works offline; source links open the repository.</p>`,{foot:'Use arrows to navigate, N for notes, O for overview, F for fullscreen. Print supports PDF.',notes:'Primary documents are committed on codex/bounded-business-decisions. Experiment1 frozen implementation9ec2e979cbc24903115bf26dd2acaa068049fad2. Experiment2 frozen implementation7400fc7. Final experiment report and verified evidence commit4226907. Protocols and reproduction commands are linked from the reports. The underlying data are the same previously inspected360 SOP-Bench validation cases. This deck was prepared October5,2026, Pacific time.'});

const stage=document.getElementById('stage');
stage.innerHTML=slides.map((s,i)=>`<section class="slide${s.dark?' dark':''}" id="slide-${i+1}" data-slide="${i+1}" aria-label="Slide ${i+1}: ${esc(s.title)}" aria-hidden="true"><div class="kicker">${s.kicker}</div>${s.cover?s.body:`<h2>${s.title}</h2><div class="body">${s.body}</div>`}<footer class="footer">${foot(s.foot||'',s.source)}<span>${String(i+1).padStart(2,'0')}</span></footer></section>`).join('');
const sections=[...stage.querySelectorAll('.slide')],overview=document.getElementById('overview'),notes=document.getElementById('notes');
let current=0;
function resize(){document.documentElement.style.setProperty('--scale',Math.max(.1,Math.min((innerWidth-24)/1280,(innerHeight-62)/720)));}
function show(index,hash=true){current=Math.max(0,Math.min(slides.length-1,index));sections.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;document.getElementById('prevButton').disabled=current===0;document.getElementById('nextButton').disabled=current===slides.length-1;document.title=`${current+1}. ${slides[current].title} · Proceda`;if(hash)history.replaceState(null,'',`#slide-${current+1}`);document.getElementById('noteTitle').textContent=slides[current].title;document.getElementById('noteText').innerHTML=`<p>${esc(slides[current].notes)}</p><p>${slides[current].source?external(SRC[slides[current].source],'Source document'):external(SRC.first,'Completion report')+' · '+external(SRC.second,'Business-decision report')}</p>`;}
document.getElementById('toc').innerHTML=slides.map((s,i)=>`<button data-go="${i}"><b>${String(i+1).padStart(2,'0')}</b>${esc(s.title)}</button>`).join('');
document.getElementById('toc').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){show(Number(b.dataset.go));overview.close();}});
document.getElementById('prevButton').onclick=()=>show(current-1);document.getElementById('nextButton').onclick=()=>show(current+1);document.getElementById('overviewButton').onclick=()=>overview.showModal();document.getElementById('notesButton').onclick=()=>notes.showModal();document.getElementById('printButton').onclick=()=>window.print();
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('fullscreenButton').textContent='Use browser fullscreen';}}
document.getElementById('fullscreenButton').onclick=fullscreen;
document.querySelectorAll('dialog .close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.addEventListener('keydown',e=>{if(overview.open||notes.open)return;if(e.altKey||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();show(current+1);}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();show(current-1);}else if(k==='home'){e.preventDefault();show(0);}else if(k==='end'){e.preventDefault();show(slides.length-1);}else if(k==='o')overview.showModal();else if(k==='n')notes.showModal();else if(k==='f')fullscreen();});
let touch=null;stage.addEventListener('touchstart',e=>{touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY];},{passive:true});stage.addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>60&&Math.abs(dy)<60)show(current+(dx<0?1:-1));touch=null;},{passive:true});
window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>{const n=Number(location.hash.match(/^#slide-(\d+)$/)?.[1]);if(n)show(n-1,false);});
const initial=Number(location.hash.match(/^#slide-(\d+)$/)?.[1])||1;resize();show(initial-1,false);
// Exposed only for reproducible local layout checks, never used for network access.
window.deck={count:slides.length,show,data:DATA};
</script>
