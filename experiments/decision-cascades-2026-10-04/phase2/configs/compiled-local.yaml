llm:
  model: openai/zai-org/GLM-5.3-Flash
  api_base: https://api.tokenfactory.nebius.com/v1
  api_key_env: NEBIUS_API_KEY
  temperature: 0.0
  max_tokens: 2048
  max_retries: 2
  timeout: 90
  reasoning_effort: low
decisions:
  enabled: true
  threshold: 0.97
  fast_completion: true
  verify_proposals: false
  max_repairs: 1
  backends:
  - name: winnow-local
    kind: ollaya
    model: winnow:e4b
    base_url: http://127.0.0.1:11435
    api_key_env: OLLAYA_API_KEY
    timeout: 45
    max_input_chars: 18000
    input_cost_per_million: 0.0
planning:
  enabled: true
  cache_dir: experiments/decision-cascades-2026-10-04/phase2/runtime-cache
  cache_epoch: phase2-v1
  compiler_llm:
    model: openai/zai-org/GLM-5.3-Flash
    api_base: https://api.tokenfactory.nebius.com/v1
    api_key_env: NEBIUS_API_KEY
    temperature: 0.0
    max_tokens: 8192
    max_retries: 2
    timeout: 90
    reasoning_effort: low
